    content: `**Evolution of the Postsecondary Success Strategy (2019–Present)**

The Postsecondary Success (PS) strategy has undergone a fundamental reframing since 2019, shifting from a pure "completion agenda" to an **equitable value** framework.

**Pre-2019: The Completion Agenda**
The strategy was primarily focused on increasing the raw number of postsecondary completions, aligned to national campaigns like Complete College America and Lumina's Goal 2025. Evidence of equity impact was limited, and a growing critique emerged that completion alone was insufficient if credentials didn't deliver real economic value.

**2019–2020: The Equitable Value Reframe**
A major strategic pivot reframed the North Star: completion is insufficient if credentials don't deliver measurable economic and social value — especially for low-income students and students of color. The four-pillar model emerged: Institutional Transformation, Public Goods, National Scale Enterprises, and Federal & State Policy.

**2020–2022: COVID Disruption and Workforce Alignment**
Community college enrollment dropped sharply in 2020–2021, disproportionately affecting low-income students and students of color. The strategy pivoted partially to enrollment recovery. Simultaneously, emphasis on labor market alignment and "good jobs" deepened — with growing investment in earnings outcomes, stackable credentials, and apprenticeship.

**2022–2025: Data Infrastructure and AI**
The Postsecondary Data Partnership (PDP), managed by the National Student Clearinghouse, expanded to cover roughly one-third of all postsecondary enrollment — a major public goods achievement. AI-powered advising and personalized learning began emerging as new strategic levers.

Key persistent investments include: corequisite remediation (replacing sequential developmental education), Guided Pathways institutional reform, and scaling of high-quality national providers like Western Governors University (WGU) and Southern New Hampshire University (SNHU).`,

    keys: ["k-12", "k12", "hqim", "instructional materials", "curriculum", "algebra", "math", "teacher", "reading", "literacy", "science of reading", "edreports"],
    content: `**Evolution of the K-12 Education Strategy (2019–Present)**

The K-12 strategy has gone through one of the most consequential pivots in USP history, followed by steady deepening and a new AI-era layer.

**2013–2018: Teacher Effectiveness Era**
The foundation invested heavily in teacher evaluation systems, value-added measures (VAM), and alternative certification pipelines. The flagship Intensive Partnerships for Effective Teaching initiative ($575M) showed minimal impacts on student achievement in a comprehensive RAND evaluation — setting the stage for a strategic reset.

**2019: Pivot to High-Quality Instructional Materials (HQIM)**
Following the Intensive Partnerships evaluation, the K-12 strategy pivoted decisively to curriculum as the primary lever. The central insight: even talented teachers cannot overcome weak curriculum — the materials in front of students every day matter enormously. HQIM adoption (as rated by EdReports) became the North Star metric.

**2020–2022: Deepening and ELA Expansion**
The HQIM strategy deepened, expanding from math into ELA. The Science of Reading movement — emphasizing explicit phonics and decoding instruction — gained significant policy traction and was integrated into the strategy. Algebra 1 was elevated as a gateway milestone: students who complete Algebra 1 by 9th grade have dramatically higher chances of postsecondary readiness.

**2023–2025: AI Integration**
The emergence of large language models opened new possibilities for AI tutoring. The K-12 strategy began integrating AI tutoring as an additional layer built on HQIM foundations — with investments in platforms like Khan Academy's Khanmigo and Carnegie Learning's AI-integrated curriculum.

A persistent tension: the foundation's visible role in developing Common Core State Standards generated significant political backlash; the strategy has navigated carefully around the "Common Core" label while continuing to fund CCSS-aligned materials.`,

    content: `**The Pathways Strategy: Overview and Evolution**

The Pathways strategy addresses the transition zone between secondary education, postsecondary education, and the workforce — a span the strategy frames as "9th through 14th grade" to emphasize continuity rather than treating high school and college as separate systems.

**Strategic Intent**
The strategy aims to create coherent, high-quality pathways that connect students — especially those from low-income backgrounds — to credentials and careers, without the dead ends and misalignment that characterize the current system. The key framing is "quality pathways": not just any pathway, but one that is academically rigorous, transparent, equitable, and connected to good jobs.

**Core Sub-strategies**
- **Dual Enrollment:** Supporting high school students taking college courses for credit, especially for first-generation students. Key barriers include course rigor, transportation, and counselor knowledge.
- **Early College High Schools (ECHS):** Schools that allow students to earn up to two years of college credit during high school — a high-evidence model for increasing completion among low-income students.
- **Career and Technical Education (CTE):** Supporting CTE programs that are genuinely industry-aligned, rigorous, and connected to PS credential pathways — moving beyond outdated "vocational ed" models.
- **Navigational Support:** Funding advising, near-peer mentoring, and FAFSA completion support at the high school–college transition point.

**Evolution**
The strategy deepened its workforce alignment focus from 2021 onward, with growing attention to apprenticeship expansion in non-traditional sectors (healthcare, tech, business services). The Washington State Initiative (WSI) serves as a place-based laboratory for Pathways approaches.`,

The USP Data Strategy is a cross-cutting investment in data infrastructure, measurement, and use across all USP strategy areas.

**Postsecondary Data Partnership (PDP)**
The flagship public goods investment is the Postsecondary Data Partnership, managed by the National Student Clearinghouse (NSC). PDP provides a shared platform for institutions to share and analyze student outcome data. By 2022, PDP covered approximately one-third of all postsecondary enrollment — a significant milestone for the field's ability to track student outcomes across institutions and over time.

PDP's value is in enabling institutions to answer questions they previously couldn't: What share of our students complete a credential within six years? How do outcomes differ by race and income? Where do students transfer, and how do they fare afterward?

**Texas Focus**
Texas has been a particular focal state for USP Data work embedded in K-12 contexts, given the scale and policy environment of the Texas education system. Investments in longitudinal data systems in Texas support the ability to track students from K-12 through postsecondary and into the workforce.

**Data as a Public Good**
A central principle of the Data Strategy is that high-quality outcome data should be a public good available to all institutions and policymakers — not locked in proprietary systems. This drove investments in open data standards, shared infrastructure, and transparency mandates at the state level.

**Connection to Other Strategy Areas**
The Data Strategy underpins all other USP strategy areas: HQIM adoption in K-12 requires good data on what materials are being used and what outcomes they produce; equitable value in PS requires program-level earnings data by race and income; Pathways requires data linking K-12, PS, and workforce.`,

    content: `**Ambition 2045 and the Postsecondary Legacy**

Ambition 2045 builds directly on the Postsecondary Success strategy's core insight: a postsecondary credential is the primary gateway to economic mobility, and that gateway must be both accessible and genuinely valuable.

**Continuity: Equitable Value as Foundation**
The equitable value framework — that credentials must deliver measurable economic and social value specifically for students from low-income backgrounds and students of color — sits at the heart of Amb'45's economic mobility priorities. The decade of investment in the Postsecondary Data Partnership (PDP) now provides the data infrastructure to actually measure whether Amb'45's goals are being achieved.

**Continuity: Institutional Reform**
The Guided Pathways work, corequisite remediation reform, and advising redesign investments from the PS strategy created the institutional change playbook that Amb'45 continues to leverage. Community colleges remain central to the Amb'45 strategy — they serve the largest share of first-generation and low-income students.

**What Amb'45 Adds: Scale and Systems**
Amb'45 raises ambition significantly — targeting systemic change at a level the PS strategy only partially achieved. Where the PS strategy often worked institution-by-institution, Amb'45 emphasizes state-level policy environments and national-scale models as the primary levers. Western Governors University and similar models become more central, not less.

**What Amb'45 Changes: Workforce Integration**

Amb'45 represents both deep continuity with USP's historical strategy and meaningful departures in ambition, framing, and theory of change.

**Where Amb'45 Continues Prior Strategy**

// ── Doc icons ────────────────────────────────────────────────────────────────
const DOC_ICONS = {
  "memo": "📄", "cover-note": "📄", "email": "📧",
  "presentation": "📊", "pre-read": "📖",
  "meeting-notes": "📝", "follow-ups": "📝",

// ── Helpers ──────────────────────────────────────────────────────────────────
function bold(text) {
  return text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
}
function renderContent(text) {
  return text.split("\n").map((line, i) => {
    if (/^-{3,}$/.test(line.trim())) return null;
    if (!line.trim()) return <div key={i} style={{height: "6px"}} />;
    const heading = line.match(/^#{1,3}\s+(.+)/);
    if (heading) return <p key={i} style={{marginTop: "10px"}}><strong dangerouslySetInnerHTML={{__html: bold(heading[1])}} /></p>;
    const bullet = line.match(/^(\s*)[-*]\s+(.+)/);
    if (bullet) return <p key={i} style={{paddingLeft: "14px"}} dangerouslySetInnerHTML={{__html: "• " + bold(bullet[2])}} />;
    return <p key={i} dangerouslySetInnerHTML={{__html: bold(line)}} />;
  }).filter(Boolean);
}

function matchResponse(bank, text) {
  const q = text.toLowerCase();
  let best = null, bestScore = 0;
  for (const r of bank) {
    const score = r.keys.filter(k => q.includes(k)).length;
    if (score > bestScore) { bestScore = score; best = r; }
  }
  return bestScore > 0 ? best : null;
}

// ── Quiz state machine ───────────────────────────────────────────────────────
// Returns {type: "quiz", ...} messages handled by QuizBubble
let quizIndex = { history: 0, ambition: 0, quiz: 0 };

function getNextQuiz(modeId) {
  const idx = quizIndex[modeId] % QUIZ_BANK.length;
  quizIndex[modeId]++;
  return { ...QUIZ_BANK[idx], isQuiz: true, role: "ai" };
}

function getDemoResponse(modeId, text) {
  const q = text.toLowerCase();

  if (modeId === "quiz") {
    return getNextQuiz(modeId);
  }

  const bank = modeId === "history" ? HISTORY_RESPONSES : AMBITION_RESPONSES;
  const match = matchResponse(bank, text);
  if (match) {
    return {
      role: "ai",
      content: match.content,
      sources: match.sources.map(s => ({
        ...s, url: null,
      })),
    };
  }
  return { role: "ai", ...FALLBACK };
}

// ── TypingIndicator ──────────────────────────────────────────────────────────
function TypingIndicator() {
  return (
    <div className="msg-row">
      <div className="avatar avatar-ai">🤖</div>
      <div className="bubble bubble-ai">
        <div className="typing">
          <div className="typing-dot" /><div className="typing-dot" /><div className="typing-dot" />
          <span style={{fontSize: 12, color: "var(--gray-400)", marginLeft: 8}}>Retrieving response…</span>
        </div>
      </div>
    </div>
  );
}

// ── SourceCards ──────────────────────────────────────────────────────────────
function SourceCards({ sources }) {
  if (!sources || sources.length === 0) return null;
  return (
    <div className="sources">
      <div className="sources-label">Sources</div>
      <div className="source-cards">
        {sources.map((s, i) => {
          const icon = DOC_ICONS[s.doc_type] || "📄";
          const label = s.topic || s.filename;
          const year = s.year ? ` (${s.year})` : "";
          const display = label.length > 44 ? label.slice(0, 42) + "…" : label;
          return (
            <div key={i} className="source-card" title={s.filename}>
              <span className="source-icon">{icon}</span>
              <span>{display}{year}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── QuizBubble ───────────────────────────────────────────────────────────────
function QuizBubble({ data, onNext }) {
  const [selected, setSelected] = useState(null);
  return (
    <div className="bubble bubble-ai">
      <p><strong>Question:</strong></p>
      <p style={{ marginTop: 8 }}>{data.question}</p>
      <div className="quiz-options">
        {data.options.map((opt) => {
          let cls = "quiz-option";
          if (selected) {
            if (opt.id === data.correct) cls += " correct";
            else if (opt.id === selected) cls += " incorrect";
          }
          return (
            <button key={opt.id} className={cls}
              onClick={() => !selected && setSelected(opt.id)}
              disabled={!!selected}>
              <strong>{opt.id.toUpperCase()}.</strong> {opt.text}
            </button>
          );
        })}
      </div>
      {selected && (
        <>
          <p style={{ marginTop: 12, fontSize: 13, color: selected === data.correct ? "#00736e" : "#9b2c2c", lineHeight: 1.5 }}>
            {selected === data.correct ? "✓ Correct! " : "✗ Not quite. "}{data.explanation}
          </p>
          <button onClick={onNext} style={{
            marginTop: 12, padding: "8px 18px",
            background: "var(--teal)", color: "white", border: "none",
            borderRadius: 8, cursor: "pointer", fontSize: 13, fontFamily: "inherit",
            fontWeight: 600,
          }}>
            Next question →
          </button>
        </>
      )}
    </div>
  );
}

// ── Message ──────────────────────────────────────────────────────────────────
function Message({ msg, onNextQuiz }) {
  if (msg.role === "user") {
    return (
      <div className="msg-row user">
        <div className="avatar avatar-user">YOU</div>
        <div className="bubble bubble-user">{msg.content}</div>
      </div>
    );
  }
  if (msg.isQuiz) {
    return (
      <div className="msg-row">
        <div className="avatar avatar-ai">🤖</div>
        <QuizBubble data={msg} onNext={onNextQuiz} />
      </div>
    );
  }
  return (
    <div className="msg-row">
      <div className="avatar avatar-ai">🤖</div>
      <div className="bubble bubble-ai">
        {renderContent(msg.content)}
        <SourceCards sources={msg.sources} />
      </div>
    </div>
  );
}

// ── WelcomeCard ───────────────────────────────────────────────────────────────
function WelcomeCard({ mode, onStarter }) {
  return (
    <div className="welcome-card">
      <h2>{mode.icon} {mode.label}</h2>
      <div className="demo-note">
        📋 <strong>Demo version</strong> — this build uses pre-loaded responses for sample questions.
        For full AI-powered Q&amp;A, visit <strong>strategpt.onrender.com</strong>.

      <p>
        {mode.id === "history" && "Ask any question about U.S. Program strategies from 2019 to present. In this demo, try the sample questions below for detailed answers."}

        {mode.id === "quiz" && "Test your knowledge of U.S. Program strategy. Click any button below to start — this demo includes 6 multiple-choice questions."}
      </p>
      <p style={{ fontSize: 12, color: "var(--gray-400)", marginTop: 8 }}>Try a sample question to get started:</p>
      <div className="starter-grid">
        {mode.starters.map((s, i) => (
          <button key={i} className="starter-btn" onClick={() => onStarter(s)}>"{s}"</button>
        ))}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [modeId, setModeId] = useState("history");
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [histories, setHistories] = useState({ history: [], ambition: [], quiz: [] });
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const messagesEndRef = useRef(null);
  const textareaRef = useRef(null);

  const mode = MODES.find((m) => m.id === modeId);
  const messages = histories[modeId];

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [histories, typing]);

  function autoResize() {
    const ta = textareaRef.current;
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
  }

  function switchMode(id) {
    setModeId(id);
    setInput("");
    if (textareaRef.current) textareaRef.current.style.height = "auto";
  }

  async function sendMessage(text) {
    const msg = text || input.trim();
    if (!msg) return;
    setInput("");
    if (textareaRef.current) textareaRef.current.style.height = "auto";

    const userMsg = { role: "user", content: msg };
    setHistories((h) => ({ ...h, [modeId]: [...h[modeId], userMsg] }));
    setTyping(true);

    // Simulate a short delay for realism
    await new Promise(r => setTimeout(r, 900 + Math.random() * 600));
    setTyping(false);

    const aiMsg = getDemoResponse(modeId, msg);
    setHistories((h) => ({ ...h, [modeId]: [...h[modeId], aiMsg] }));
  }

  function handleNextQuiz() {
    const aiMsg = getNextQuiz(modeId);
    setHistories((h) => ({ ...h, [modeId]: [...h[modeId], aiMsg] }));
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const tags = [
    { label: "K-12 Education",   cls: "tag-teal"     },
    { label: "Postsecondary",    cls: "tag-blue"     },
    { label: "Pathways",         cls: "tag-green"    },
    { label: "Data",             cls: "tag-charcoal" },
    { label: "Charters",         cls: "tag-magenta"  },
    { label: "Washington State", cls: "tag-purple"   },
    { label: "Amb'45",           cls: "tag-gold"     },
  ];

  return (
    <>
      <header>
        <div className="header-left">
          <div className="logo-mark">🤖</div>
          <div>
            <div className="app-title">StrateGPT</div>
            <div className="app-subtitle">U.S. Program Strategy Assistant</div>
          </div>
        </div>
        <div className="header-right">
          <span className="demo-badge">DEMO</span>
          <span className="header-badge">Gates Foundation · Internal</span>
        </div>
      </header>

      <div className="disclaimer">
        ⚠️ Demo version with pre-loaded responses. For full AI-powered Q&amp;A, visit <strong>strategpt.onrender.com</strong>. <strong>Internal use only.</strong>
      </div>

      <div className="app-body">
        {!sidebarOpen && (
          <button className="sidebar-expand" onClick={() => setSidebarOpen(true)} title="Open sidebar">▶</button>
        )}
        <aside className={`sidebar${sidebarOpen ? "" : " collapsed"}`}>
          <div className="sidebar-toggle-row">
            <button className="sidebar-toggle" onClick={() => setSidebarOpen(o => !o)} title="Collapse sidebar">◀</button>
          </div>
          <div className="sidebar-section">
            <div className="sidebar-label">Mode</div>
            {MODES.map((m) => (
              <button key={m.id}
                className={`mode-btn ${modeId === m.id ? `active active-${m.id}` : ""}`}
                onClick={() => switchMode(m.id)}>
                <span className="mode-icon">{m.icon}</span>
                <span className="mode-text">{m.label}<small>{m.short}</small></span>
              </button>
            ))}
          </div>
          <hr className="sidebar-divider" />
          <div className="sidebar-section">
            <div className="sidebar-label">Knowledge Base</div>
          </div>
          <div className="doc-count-pill">
            <div>
              <strong>584</strong>
              <div style={{ fontSize: 11 }}>USP strategy docs · 2019–2026</div>
            </div>
          </div>
          <div style={{ padding: "0 16px 16px" }}>
            {tags.map((t, i) => (
              <span key={i} className={`strategy-tag ${t.cls}`}>{t.label}</span>

          </div>
        </aside>

        <main className="chat-area">
          <div className={`mode-banner mode-${modeId}`}>
            <span className="mode-banner-icon">{mode.icon}</span>
            <div>
              <div className="mode-banner-title">{mode.label}</div>
              <div className="mode-banner-desc">{mode.banner}</div>
            </div>
          </div>

          <div className="messages">
            {messages.length === 0 && <WelcomeCard mode={mode} onStarter={sendMessage} />}
            {messages.map((msg, i) => (
              <Message key={i} msg={msg} onNextQuiz={handleNextQuiz} />
            ))}
            {typing && <TypingIndicator />}
            <div ref={messagesEndRef} />
          </div>

          <div className="input-bar">
            <div className="input-wrapper">

                ref={textareaRef}
                value={input}
                onChange={(e) => { setInput(e.target.value); autoResize(); }}
                onKeyDown={handleKeyDown}
                placeholder={mode.placeholder}
                rows={1}
              />
              <button className="send-btn" onClick={() => sendMessage()} disabled={!input.trim() || typing}>↑</button>
            </div>
          </div>
          <div className="input-hint">Shift + Enter for new line · Enter to send</div>
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
